<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nada's Unit - Onboarding</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #f0f4f0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
header { background: #2d5016; color: #fff; padding: 20px 16px; text-align: center; }
header h1 { font-size: 20px; font-weight: 700; }
header p { font-size: 13px; opacity: 0.8; margin-top: 4px; }
.container { max-width: 600px; margin: 0 auto; padding: 16px; }
.section { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.section-title { font-size: 13px; font-weight: 700; color: #2d5016; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
.check-item { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; cursor: pointer; gap: 12px; }
.check-item:last-child { border-bottom: none; }
.check-item.done .check-label { text-decoration: line-through; color: #999; }
.check-box { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #ccc; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.check-box.checked { background: #2d5016; border-color: #2d5016; }
.check-box.checked::after { content: ""; display: block; width: 6px; height: 10px; border: 2px solid #fff; border-top: none; border-left: none; transform: rotate(45deg) translateY(-2px); }
.check-label { font-size: 15px; color: #222; flex: 1; }
.callout { margin-bottom: 14px; background: #f8f9f8; border-radius: 8px; padding: 12px; }
.callout:last-child { margin-bottom: 0; }
.callout-title { font-size: 11px; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px; }
.field-row { margin-bottom: 8px; }
.field-label { display: block; font-size: 11px; color: #888; margin-bottom: 3px; font-weight: 600; }
.field-input { width: 100%; border: 1px solid #e0e0e0; border-radius: 6px; padding: 8px 10px; font-size: 14px; background: #fff; color: #222; outline: none; }
.field-input:focus { border-color: #2d5016; }
.save-btn { display: block; width: 100%; background: #2d5016; color: #fff; border: none; border-radius: 10px; padding: 16px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; }
.loading-state { text-align: center; padding: 60px 20px; color: #666; }
.spinner { width: 32px; height: 32px; border: 3px solid #e0e0e0; border-top-color: #2d5016; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.progress-bar { background: #e0e0e0; border-radius: 4px; height: 6px; margin-bottom: 12px; overflow: hidden; }
.progress-fill { background: #2d5016; height: 100%; border-radius: 4px; transition: width 0.3s; }
.progress-text { font-size: 12px; color: #666; margin-bottom: 6px; }
</style>
</head>
<body>
<header>
  <h1>Nada's Unit Onboarding</h1>
  <p>Track setup progress for your unit</p>
</header>
<div class="container">
  <div id="app"><div class="loading-state"><div class="spinner"></div><p>Loading from Notion...</p></div></div>
  <button class="save-btn" onclick="saveFields()">Save Unit Info</button>
</div>
<script>
var GROUPS = [
  {ctx:"Building Details",fields:["Management Email","Building Registration Process","Building Name","Address","Location Link"]},
  {ctx:"Unit Specs",fields:["Bedrooms","Bathrooms","Unit Size (SQM)","Bed Size(s)","Sofa Bed","Kitchenware Quantity"]},
  {ctx:"Access Details",fields:["Smart Lock","Smart Lock Code","Number of Keys","Access Cards (Quantity)"]},
  {ctx:"Wi-Fi Details",fields:["Username / SSID","Password"]},
  {ctx:"Parking Details",fields:["Parking Number","Floor / Location"]},
  {ctx:"DEWA Login",fields:["Username","Password","Account Number"]},
  {ctx:"DU Login",fields:["Username","Password","Account Number","Due Date"]}
];

function apiGet(path){
  return fetch(path).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();});
}

function apiPatch(path,body){
  return fetch(path,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();});
}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function renderPage(data){
  var cbMap={}, fMap={};
  for(var i=0;i<data.checkboxes.length;i++) cbMap[data.checkboxes[i].label]=data.checkboxes[i];
  for(var i=0;i<data.fields.length;i++) fMap[data.fields[i].label]=data.fields[i];

  var done=0;
  for(var i=0;i<data.checkboxes.length;i++) if(data.checkboxes[i].checked) done++;
  var total=data.checkboxes.length, pct=total>0?Math.round(done/total*100):0;

  var html="";

  html+="<div class=\"section\">";
  html+="<div class=\"progress-text\">"+done+" of "+total+" complete ("+pct+"%)</div>";
  html+="<div class=\"progress-bar\"><div class=\"progress-fill\" id=\"pfill\" style=\"width:"+pct+"%\"></div></div>";
  html+="</div>";

  html+="<div class=\"section\">";
  html+="<div class=\"section-title\">Onboarding Checklist</div>";
  for(var i=0;i<data.checkboxes.length;i++){
    var cb=data.checkboxes[i];
    var eid=cb.id.replace(/-/g,"");
    html+="<div class=\"check-item"+(cb.checked?" done":"")+"\" id=\"ci_"+eid+"\" data-nid=\""+esc(cb.id)+"\" data-eid=\""+eid+"\">";
    html+="<div class=\"check-box"+(cb.checked?" checked":"")+"\" id=\"cx_"+eid+"\"></div>";
    html+="<span class=\"check-label\">"+esc(cb.label)+"</span>";
    html+="</div>";
  }
  html+="</div>";

  html+="<div class=\"section\">";
  html+="<div class=\"section-title\">Unit Information</div>";
  for(var g=0;g<GROUPS.length;g++){
    var grp=GROUPS[g];
    html+="<div class=\"callout\">";
    html+="<div class=\"callout-title\">"+esc(grp.ctx)+"</div>";
    for(var f=0;f<grp.fields.length;f++){
      var fn=grp.fields[f], fd=fMap[fn];
      var feid=fd?fd.id.replace(/-/g,""):"nf_"+g+"_"+f;
      var fid=fd?fd.id:"";
      html+="<div class=\"field-row\">";
      html+="<label class=\"field-label\">"+esc(fn)+"</label>";
      html+="<input class=\"field-input\" id=\"fi_"+feid+"\" data-fid=\""+esc(fid)+"\" data-fl=\""+esc(fn)+"\" placeholder=\"Not set\">";
      html+="</div>";
    }
    html+="</div>";
  }
  html+="</div>";

  document.getElementById("app").innerHTML=html;

  for(var g=0;g<GROUPS.length;g++){
    for(var f=0;f<GROUPS[g].fields.length;f++){
      var fn=GROUPS[g].fields[f], fd=fMap[fn];
      if(fd&&fd.value){
        var el=document.getElementById("fi_"+fd.id.replace(/-/g,""));
        if(el) el.value=fd.value;
      }
    }
  }

  var items=document.querySelectorAll(".check-item");
  for(var i=0;i<items.length;i++){
    items[i].addEventListener("click",function(){
      toggleCheck(this.getAttribute("data-eid"),this.getAttribute("data-nid"),this);
    });
  }
}

function toggleCheck(eid,nid,el){
  var item=el||document.getElementById("ci_"+eid);
  var box=document.getElementById("cx_"+eid);
  var checked=item.classList.contains("done");
  var nv=!checked;
  if(nv){item.classList.add("done");box.classList.add("checked");}
  else{item.classList.remove("done");box.classList.remove("checked");}
  updateProgress();
  apiPatch("/api/checkbox",{id:nid,checked:nv}).catch(function(e){
    if(nv){item.classList.remove("done");box.classList.remove("checked");}
    else{item.classList.add("done");box.classList.add("checked");}
    updateProgress();
    alert("Could not save: "+e.message);
  });
}

function updateProgress(){
  var items=document.querySelectorAll(".check-item");
  var done=document.querySelectorAll(".check-item.done").length;
  var total=items.length, pct=total>0?Math.round(done/total*100):0;
  var fill=document.getElementById("pfill");
  var txt=document.querySelector(".progress-text");
  if(fill) fill.style.width=pct+"%";
  if(txt) txt.textContent=done+" of "+total+" complete ("+pct+"%)";
}

function saveFields(){
  var inputs=document.querySelectorAll(".field-input");
  var patches=[];
  for(var i=0;i<inputs.length;i++){
    var fid=inputs[i].getAttribute("data-fid");
    var fl=inputs[i].getAttribute("data-fl");
    var fv=inputs[i].value;
    if(fid) patches.push(apiPatch("/api/field",{id:fid,label:fl,value:fv}));
  }
  Promise.all(patches).then(function(){alert("Saved!");}).catch(function(e){alert("Error: "+e.message);});
}

function load(){
  apiGet("/api/page").then(function(data){renderPage(data);}).catch(function(e){
    document.getElementById("app").innerHTML="<div class=\"loading-state\">Could not load: "+e.message+"</div>";
  });
}

document.addEventListener("DOMContentLoaded",load);
</script>
</body>
</html>
