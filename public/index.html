<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Nada's Unit - Onboarding</title> <style> :root { --bg: #F6F5F1; --card: #FFFFFF; --grn: #25855A; --grn-light: #EBF5EE; --acc: #B8916A; --acc-light: #FAF3EC; --text: #1A1A1A; --muted: #6B6B6B; --border: #E5E2DB; --red: #C53030; } * { box-sizing: border-box; margin: 0; padding: 0; } body { background: var(--bg); font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: var(--text); min-height: 100vh; } .header { background: var(--grn); color: #fff; padding: 28px 24px 24px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(37,133,90,0.3); } .header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; } .header-sub { font-size: 13px; opacity: 0.85; margin-top: 3px; } .progress-bar-wrap { background: rgba(255,255,255,0.2); border-radius: 99px; height: 6px; margin: 14px auto 0; max-width: 320px; } .progress-bar-fill { background: #fff; height: 100%; border-radius: 99px; transition: width 0.5s ease; } .progress-label { font-size: 12px; opacity: 0.9; margin-top: 6px; } .container { max-width: 720px; margin: 0 auto; padding: 20px 16px 100px; } .unit-card { background: var(--card); border-radius: 16px; margin-bottom: 20px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); padding: 20px 24px; display: flex; align-items: center; gap: 16px; border-left: 4px solid var(--acc); } .unit-card-label { font-size: 14px; font-weight: 700; color: var(--acc); white-space: nowrap; } .unit-input { flex: 1; border: none; border-bottom: 2px solid var(--border); background: transparent; font-size: 22px; font-weight: 700; color: var(--text); font-family: inherit; padding: 4px 0; outline: none; transition: border-color 0.2s; } .unit-input:focus { border-color: var(--grn); } .unit-input::placeholder { color: var(--border); font-weight: 400; font-size: 18px; } .section { background: var(--card); border-radius: 16px; margin-bottom: 20px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); } .section-header { padding: 16px 20px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; } .section-title { font-size: 15px; font-weight: 700; color: var(--text); } .section-mini-bar { display: flex; align-items: center; gap: 8px; } .mini-bar-track { width: 60px; height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; } .mini-bar-fill { height: 100%; background: var(--grn); border-radius: 99px; transition: width 0.4s ease; } .mini-count { font-size: 11px; color: var(--muted); white-space: nowrap; } .check-item { display: flex; align-items: center; gap: 14px; padding: 13px 20px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s; } .check-item:last-child { border-bottom: none; } .check-item:hover { background: #FAFAF8; } .check-box { width: 20px; height: 20px; border: 2px solid var(--border); border-radius: 5px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s; background: #fff; } .check-box.checked { background: var(--grn); border-color: var(--grn); } .check-box.checked::after { content: ""; display: block; width: 10px; height: 6px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translateY(-1px); } .check-label { font-size: 14px; line-height: 1.4; flex: 1; } .check-item.done .check-label { color: var(--muted); text-decoration: line-through; } .info-callout { border-bottom: 1px solid var(--border); } .info-callout:last-child { border-bottom: none; } .callout-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.7px; color: var(--acc); padding: 12px 20px 6px; } .field-row { display: flex; align-items: center; gap: 10px; padding: 8px 20px; border-bottom: 1px solid #F0EDE8; } .field-row:last-child { border-bottom: none; } .field-label { font-size: 13px; color: var(--muted); width: 130px; flex-shrink: 0; } .field-input { flex: 1; border: 1px solid transparent; border-radius: 8px; padding: 6px 10px; font-size: 13px; background: transparent; color: var(--text); transition: all 0.2s; font-family: inherit; } .field-input:focus { outline: none; border-color: var(--grn); background: var(--grn-light); } .save-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); padding: 12px 20px; display: flex; gap: 10px; align-items: center; z-index: 200; box-shadow: 0 -2px 12px rgba(0,0,0,0.06); } .save-btn { flex: 1; background: var(--grn); color: #fff; border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; transition: background 0.2s; } .save-btn:hover { background: #1E6B48; } .save-btn:disabled { background: #9CB8AC; cursor: not-allowed; } .save-status { font-size: 13px; color: var(--muted); min-width: 120px; text-align: right; } .save-status.ok { color: var(--grn); font-weight: 600; } .save-status.err { color: var(--red); } .success-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 500; display: flex; align-items: center; justify-content: center; } .success-card { background: #fff; border-radius: 20px; padding: 36px 32px; text-align: center; max-width: 340px; margin: 0 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); } .success-icon { font-size: 48px; margin-bottom: 12px; } .success-title { font-size: 20px; font-weight: 700; color: var(--grn); margin-bottom: 8px; } .success-sub { font-size: 14px; color: var(--muted); line-height: 1.5; } .success-close { margin-top: 24px; background: var(--grn); color: #fff; border: none; border-radius: 12px; padding: 12px 32px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; } .loading-state { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 15px; } .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--grn); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px; } @keyframes spin { to { transform: rotate(360deg); } } .drive-link { display: flex; align-items: center; gap: 8px; padding: 14px 20px; font-size: 13px; color: var(--grn); text-decoration: none; font-weight: 600; border-top: 1px solid var(--border); } .drive-link:hover { background: var(--grn-light); } @media (max-width: 480px) { .field-label { width: 110px; font-size: 12px; } .field-input { font-size: 12px; } .section-title { font-size: 14px; } .unit-input { font-size: 18px; } } </style> </head> <body> <div class="header"> <h1>Nada's Unit Onboarding</h1> <p class="header-sub">Dubai Short-Term Rental Setup</p> <div class="progress-bar-wrap"> <div class="progress-bar-fill" id="mainProgress" style="width:0%"></div> </div> <div class="progress-label" id="progressLabel">Loading...</div> </div> <div class="container"> <div class="unit-card"> <span class="unit-card-label">Unit #</span> <input class="unit-input" id="unitNumber" type="text" placeholder="e.g. 1204" maxlength="20"> </div> <div id="app"> <div class="loading-state"> <div class="spinner"></div> Loading from Notion... </div> </div> </div> <div class="save-bar"> <button class="save-btn" id="saveBtn" onclick="submitUnit()">Submit Unit Info</button> <div class="save-status" id="saveStatus"></div> </div> <script> var fieldMeta = {}; var cbState = {}; var allCheckboxData = []; var GROUPS = [ {ctx:"Building Details", fields:["Management Email","Building Registration Process","Building Name","Address","Location Link"]}, {ctx:"Unit Specs", fields:["Bedrooms","Bathrooms","Unit Size (SQM)","Bed Size(s)","Sofa Bed","Kitchenware Quantity"]}, {ctx:"Access Details", fields:["Smart Lock","Smart Lock Code","Number of Keys","Access Cards (Quantity)"]}, {ctx:"Wi-Fi Details", fields:["Username / SSID","Password"]}, {ctx:"Parking Details", fields:["Parking Number","Floor / Location"]}, {ctx:"DEWA Login", fields:["Username","Password","Account Number"]}, {ctx:"DU Login", fields:["Username","Password","Account Number","Due Date"]} ]; var savedUnit = localStorage.getItem("unitNumber"); if (savedUnit) document.getElementById("unitNumber").value = savedUnit; document.getElementById("unitNumber").addEventListener("input", function() { localStorage.setItem("unitNumber", this.value); }); function apiGet(path) { return fetch(path).then(function(r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }); } function apiPatch(path, body) { return fetch(path, {method:"PATCH", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)}) .then(function(r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }); } function esc(s) { return (s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); } function renderPage(data) { allCheckboxData = data.checkboxes; var fieldByLabel = {}; for (var i = 0; i < data.fields.length; i++) { fieldByLabel[data.fields[i].label.toLowerCase().trim()] = data.fields[i]; } var html = ""; var total = data.checkboxes.length; var done = 0; for (var i = 0; i < data.checkboxes.length; i++) { if (data.checkboxes[i].checked) done++; } html += "<div class=\"section\">"; html += "<div class=\"section-header\">"; html += "<span class=\"section-title\">Onboarding Checklist</span>"; html += "<div class=\"section-mini-bar\">"; html += "<div class=\"mini-bar-track\"><div class=\"mini-bar-fill\" id=\"mainMini\" style=\"width:" + (total>0?Math.round(done/total*100):0) + "%\"></div></div>"; html += "<span class=\"mini-count\" id=\"miniCount\">" + done + "/" + total + "</span>"; html += "</div></div>"; for (var i = 0; i < data.checkboxes.length; i++) { var cb = data.checkboxes[i]; var eid = cb.id.replace(/-/g, ""); var checked = cb.checked; cbState[cb.id] = checked; html += "<div class=\"check-item" + (checked ? " done" : "") + "\" id=\"item_" + eid + "\" data-eid=\"" + eid + "\" data-nid=\"" + esc(cb.id) + "\">"; html += "<div class=\"check-box" + (checked ? " checked" : "") + "\" id=\"box_" + eid + "\"></div>"; html += "<span class=\"check-label\">" + esc(cb.label) + "</span>"; html += "</div>"; } html += "</div>"; html += "<div class=\"section\">"; html += "<div class=\"section-header\"><span class=\"section-title\">Unit Information</span></div>"; for (var g = 0; g < GROUPS.length; g++) { var grp = GROUPS[g]; html += "<div class=\"info-callout\">"; html += "<div class=\"callout-title\">" + esc(grp.ctx) + "</div>"; for (var f = 0; f < grp.fields.length; f++) { var fn = grp.fields[f]; var inputId = "fi_" + g + "_" + f; html += "<div class=\"field-row\">"; html += "<span class=\"field-label\">" + esc(fn) + "</span>"; html += "<input class=\"field-input\" id=\"" + inputId + "\" type=\"text\" placeholder=\"--\">"; html += "</div>"; } html += "</div>"; } html += "<a class=\"drive-link\" href=\"https://drive.google.com/drive/folders/1jUqWcN1L9APnnUOE4417VLYcKxo2WneV\" target=\"_blank\">Open Google Drive Documents</a>"; html += "</div>"; document.getElementById("app").innerHTML = html; for (var g = 0; g < GROUPS.length; g++) { for (var f = 0; f < GROUPS[g].fields.length; f++) { var fn = GROUPS[g].fields[f]; var fd = fieldByLabel[fn.toLowerCase().trim()]; var inputId = "fi_" + g + "_" + f; var el = document.getElementById(inputId); if (el && fd) { if (fd.value) el.value = fd.value; fieldMeta[inputId] = {notionId: fd.id, label: fd.label}; } } } var items = document.querySelectorAll(".check-item"); for (var i = 0; i < items.length; i++) { items[i].addEventListener("click", function() { toggleCheck(this.getAttribute("data-eid"), this.getAttribute("data-nid"), this); }); } updateProgress(done, total); } function updateProgress(done, total) { var pct = total > 0 ? Math.round(done / total * 100) : 0; var mp = document.getElementById("mainProgress"); var pl = document.getElementById("progressLabel"); var mini = document.getElementById("mainMini"); var mc = document.getElementById("miniCount"); if (mp) mp.style.width = pct + "%"; if (pl) pl.textContent = done + " of " + total + " complete (" + pct + "%)"; if (mini) mini.style.width = pct + "%"; if (mc) mc.textContent = done + "/" + total; } function recalcProgress() { var items = document.querySelectorAll(".check-item"); var done = document.querySelectorAll(".check-item.done").length; updateProgress(done, items.length); } function toggleCheck(eid, nid, el) { if (!nid) return; var newChecked = !cbState[nid]; cbState[nid] = newChecked; var box = document.getElementById("box_" + eid); var item = el || document.getElementById("item_" + eid); if (newChecked) { box.classList.add("checked"); item.classList.add("done"); } else { box.classList.remove("checked"); item.classList.remove("done"); } recalcProgress(); apiPatch("/api/checkbox", {id: nid, checked: newChecked}).catch(function(e) { cbState[nid] = !newChecked; if (!newChecked) { box.classList.add("checked"); item.classList.add("done"); } else { box.classList.remove("checked"); item.classList.remove("done"); } recalcProgress(); alert("Could not save. Check your connection."); }); } function setStatus(msg, type) { var el = document.getElementById("saveStatus"); if (!el) return; el.textContent = msg; el.className = "save-status" + (type ? " " + type : ""); } function resetForm(unitNum) { document.getElementById("unitNumber").value = ""; localStorage.removeItem("unitNumber"); var inputs = document.querySelectorAll(".field-input"); for (var i = 0; i < inputs.length; i++) { inputs[i].value = ""; } var items = document.querySelectorAll(".check-item"); for (var i = 0; i < items.length; i++) { var eid = items[i].getAttribute("data-eid"); var nid = items[i].getAttribute("data-nid"); var box = document.getElementById("box_" + eid); items[i].classList.remove("done"); if (box) box.classList.remove("checked"); if (nid) cbState[nid] = false; } updateProgress(0, items.length); var overlay = document.createElement("div"); overlay.className = "success-overlay"; overlay.innerHTML = "<div class=\"success-card\"><div class=\"success-icon\">\u2705</div><div class=\"success-title\">Unit " + esc(unitNum) + " Saved!</div><div class=\"success-sub\">A new Notion page has been created:<br><strong>Unit " + esc(unitNum) + " - Nada\u2019s Unit Onboarding</strong><br><br>The form has been reset for the next unit.</div><button class=\"success-close\" onclick=\"this.parentElement.parentElement.remove()\">Done</button></div>"; document.body.appendChild(overlay); } function submitUnit() { var unitNum = (document.getElementById("unitNumber").value || "").trim(); if (!unitNum) { alert("Please enter a Unit # before submitting."); document.getElementById("unitNumber").focus(); return; } var btn = document.getElementById("saveBtn"); btn.disabled = true; btn.textContent = "Submitting..."; setStatus("Saving to Notion...", ""); var fieldList = []; var keys = Object.keys(fieldMeta); for (var i = 0; i < keys.length; i++) { var inputId = keys[i]; var meta = fieldMeta[inputId]; var el = document.getElementById(inputId); fieldList.push({ id: meta.notionId, label: meta.label, value: el ? el.value : "" }); } var cbList = []; var items = document.querySelectorAll(".check-item"); for (var i = 0; i < items.length; i++) { var nid = items[i].getAttribute("data-nid"); var labelEl = items[i].querySelector(".check-label"); if (nid) { cbList.push({ id: nid, label: labelEl ? labelEl.textContent : "", checked: cbState[nid] || false }); } } fetch("/api/submit", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ unitNumber: unitNum, fields: fieldList, checkboxes: cbList }) }) .then(function(r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }) .then(function(data) { btn.disabled = false; btn.textContent = "Submit Unit Info"; setStatus("", ""); resetForm(unitNum); }) .catch(function(e) { btn.disabled = false; btn.textContent = "Submit Unit Info"; setStatus("Submission failed", "err"); alert("Could not submit. Check your connection.\n" + e.message); }); } function load() { apiGet("/api/page").then(function(data) { renderPage(data); }).catch(function(e) { document.getElementById("app").innerHTML = "<div class=\"loading-state\">Could not load Notion data.<br><small style=\"color:#999;margin-top:8px;display:block\">" + e.message + "</small><button onclick=\"load()\" style=\"margin-top:16px;padding:10px 24px;background:var(--grn);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;\">Retry</button></div>"; }); } document.addEventListener("DOMContentLoaded", load); </script> </body> </html>
